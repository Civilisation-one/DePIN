name: Verify DePIN node MVP
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run identity and verification tests
        run: python -m pytest -q tests
      - name: Run non-networked demo
        run: python -m scripts.demo_node
